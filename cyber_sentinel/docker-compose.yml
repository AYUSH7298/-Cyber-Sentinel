version: "3.9"

services:
  # ─── FastAPI Backend Engine ─────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber_sentinel_api
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    volumes:
      - .:/cyber_sentinel
      - model_cache:/root/.cache/huggingface   # Cache downloaded AI models
    environment:
      - DATABASE_URL=sqlite:///./cyber_sentinel.db
      - ENVIRONMENT=development
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ─── Streamlit Dashboard ────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber_sentinel_dashboard
    command: python -m streamlit run dashboard/app_ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/cyber_sentinel
    environment:
      - API_BASE_URL=http://api:8080
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model_cache:
    driver: local
