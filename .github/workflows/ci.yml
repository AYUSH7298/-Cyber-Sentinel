name: Cyber Sentinel CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./cyber_sentinel
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: ./cyber_sentinel
        run: |
          pip install flake8
          flake8 backend/ --max-line-length=100 --ignore=E501,W503

      - name: Run tests
        working-directory: ./cyber_sentinel
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest tests/ -v --tb=short

      - name: Cleanup test DB
        working-directory: ./cyber_sentinel
        if: always()
        run: rm -f test_cyber_sentinel.db test.db

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./cyber_sentinel
        run: |
          docker build -t cyber-sentinel:latest .
          echo "Docker build successful ✓"
